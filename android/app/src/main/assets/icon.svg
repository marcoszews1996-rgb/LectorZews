<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="50%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="102" fill="none" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="4" />

  <!-- Center Decorative Glow Circle -->
  <circle cx="256" cy="256" r="160" fill="#f59e0b" fill-opacity="0.06" />

  <!-- Book Open Icon with Soundwaves / Headphones -->
  <g transform="translate(256, 250) scale(1.15)" filter="url(#glow)">
    <!-- Open Book Pages Left -->
    <path d="M-10 -20 C -50 -45, -100 -40, -130 -25 C -135 -22, -140 -16, -140 -8 L -140 75 C -140 85, -130 90, -120 85 C -90 75, -50 80, -10 100 Z" fill="url(#goldGrad)" />
    
    <!-- Open Book Pages Right -->
    <path d="M10 -20 C 50 -45, 100 -40, 130 -25 C 135 -22, 140 -16, 140 -8 L 140 75 C 140 85, 130 90, 120 85 C 90 75, 50 80, 10 100 Z" fill="url(#goldGrad)" opacity="0.9" />

    <!-- Book Spine Divider -->
    <rect x="-3" y="-18" width="6" height="118" rx="3" fill="#fef3c7" opacity="0.8" />

    <!-- Headphone Arc over book -->
    <path d="M -95 10 A 95 95 0 0 1 95 10" fill="none" stroke="#fef08a" stroke-width="12" stroke-linecap="round" />
    
    <!-- Ear cups -->
    <rect x="-106" y="5" width="22" height="42" rx="11" fill="url(#accentGrad)" stroke="#fef08a" stroke-width="4" />
    <rect x="84" y="5" width="22" height="42" rx="11" fill="url(#accentGrad)" stroke="#fef08a" stroke-width="4" />

    <!-- Dynamic Soundwaves radiating from center top -->
    <circle cx="0" cy="-60" r="10" fill="#fde047" />
    <path d="M -24 -60 A 24 24 0 0 1 24 -60" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <path d="M -42 -60 A 42 42 0 0 1 42 -60" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Typography Monogram 'Z' in bottom center -->
  <text x="256" y="445" font-family="'Cinzel', 'Playfair Display', serif" font-size="42" font-weight="bold" fill="#fef3c7" text-anchor="middle" letter-spacing="4">LECTORZEWS</text>
</svg>
